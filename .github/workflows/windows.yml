name: Build Windows package

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: bifrost-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Read app version
        id: app_version
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Analyze source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath bifrost-windows-portable.zip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" /OOutput windows\bifrost.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rename Windows packages with version
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          Move-Item Output\Bifrost-Windows-Installer.exe "Bifrost-Windows-$version.exe"
          Rename-Item bifrost-windows-portable.zip "Bifrost-Windows-$version-portable.zip"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-windows-build
          path: |
            Bifrost-Windows-*.zip
            Bifrost-Windows-*.exe
          if-no-files-found: error
