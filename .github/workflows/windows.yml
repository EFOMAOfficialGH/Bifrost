name: Build Windows package

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath bifrost-windows-portable.zip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create installer script
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          @'
          [Setup]
          AppName=Bifrost
          AppVersion=VERSION_PLACEHOLDER
          DefaultDirName={autopf}\Bifrost
          OutputBaseFilename=bifrost-windows-installer
          ArchitecturesInstallIn64BitMode=x64
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autodesktop}\Bifrost"; Filename: "{app}\bifrost.exe"
          [Registry]
          Root: HKCR; Subkey: "*\shell\Send with Bifrost"; ValueType: string; ValueName: ""; ValueData: "Send with Bifrost"; Flags: uninsdeletekey
          Root: HKCR; Subkey: "*\shell\Send with Bifrost\command"; ValueType: string; ValueName: ""; ValueData: """{app}\bifrost.exe"" ""%1"""
          '@ | Out-File -Encoding utf8 bifrost.iss
          (Get-Content bifrost.iss) -replace 'VERSION_PLACEHOLDER', $version | Set-Content -Encoding utf8 bifrost.iss
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" bifrost.iss'

      - name: Rename Windows packages with version
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          if ($env:GITHUB_REF -eq 'refs/heads/main' -or $env:GITHUB_REF -eq 'refs/heads/master') {
            Rename-Item Output\bifrost-windows-installer.exe 'Bifrost-Windows-latest.exe'
            Rename-Item bifrost-windows-portable.zip 'Bifrost-Windows-latest-portable.zip'
          } else {
            Rename-Item Output\bifrost-windows-installer.exe "Bifrost-Windows-$version.exe"
            Rename-Item bifrost-windows-portable.zip "Bifrost-Windows-$version-portable.zip"
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-windows-build
          path: |
            Bifrost-Windows-*.zip
            Bifrost-Windows-*.exe
          if-no-files-found: error

      - name: Publish Windows packages to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = 'nightly'
          }
          $releaseReady = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              $releaseReady = $true
              break
            }
            Start-Sleep -Seconds 20
          }
          if (-not $releaseReady) {
            throw "The Android workflow did not create release $tag within the expected time."
          }
          gh release upload $tag Bifrost-Windows-*.exe Bifrost-Windows-*.zip --repo $env:GITHUB_REPOSITORY --clobber
