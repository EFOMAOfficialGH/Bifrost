name: Build Android APK
on:
  workflow_run:
    workflows: ["Build Windows package"]
    types: [completed]
    branches: [main, master]
concurrency:
  group: bifrost-android-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: write
jobs:
  build-android:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Download matching Windows packages
        uses: actions/download-artifact@v4
        with:
          name: bifrost-windows-build
          path: windows-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify Windows installer package
        shell: bash
        run: |
          installer=$(find windows-artifact -maxdepth 1 -type f -name 'Bifrost-Windows-*.exe' | head -n 1)
          if [ -z "$installer" ]; then
            echo "The matching Windows installer artifact was not found. Run the Windows workflow first." >&2
            exit 1
          fi
          mkdir -p android/app/src/main/assets
          cp "$installer" android/app/src/main/assets/bifrost-windows-installer.exe
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Read app version
        id: app_version
        shell: bash
        run: echo "version=$(awk '/^version:/{print $2}' pubspec.yaml)" >> "$GITHUB_OUTPUT"
      - name: Analyze source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Configure stable Android signing
        if: env.BIFROST_KEYSTORE_BASE64 != ''
        shell: bash
        env:
          BIFROST_KEYSTORE_BASE64: ${{ secrets.BIFROST_KEYSTORE_BASE64 }}
          BIFROST_KEYSTORE_PASSWORD: ${{ secrets.BIFROST_KEYSTORE_PASSWORD }}
          BIFROST_KEY_PASSWORD: ${{ secrets.BIFROST_KEY_PASSWORD }}
          BIFROST_KEY_ALIAS: ${{ secrets.BIFROST_KEY_ALIAS }}
        run: |
          echo "$BIFROST_KEYSTORE_BASE64" | base64 --decode > android/bifrost-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$BIFROST_KEYSTORE_PASSWORD
          keyPassword=$BIFROST_KEY_PASSWORD
          keyAlias=$BIFROST_KEY_ALIAS
          storeFile=../bifrost-upload.jks
          EOF
      - name: Build release APK
        run: flutter build apk --release
      - name: Rename APK with version
        shell: bash
        run: |
          version="$(awk '/^version:/{print $2}' pubspec.yaml)"
          cp build/app/outputs/flutter-apk/app-release.apk "Bifrost-Android-${version}.apk"
      - name: Upload APK and Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-release-build
          path: |
            Bifrost-Android-*.apk
            windows-artifact/Bifrost-Windows-*.exe
            windows-artifact/Bifrost-Windows-*.zip
          if-no-files-found: error
      - name: Generate release notes
        shell: bash
        run: |
          version="$(awk '/^version:/{print $2}' pubspec.yaml)"
          {
            echo "# Bifrost build"
            echo
            echo "- Version: $version"
            echo "- Commit: ${GITHUB_SHA:0:7}"
            echo "- Source: $GITHUB_REF_NAME"
            echo
            echo "## Recent changes"
            git log -10 --pretty=format:'- %s (%h)'
            echo
            echo
            echo "## Included downloads"
            echo "- Android APK with the matching Windows installer embedded"
            echo "- Windows installer"
            echo "- Windows portable ZIP"
          } > release-notes.md
      - name: Publish all packages to GitHub Release
        if: github.event_name == 'workflow_run'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: Bifrost v${{ steps.app_version.outputs.version }}
          prerelease: false
          make_latest: true
          body_path: release-notes.md
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          overwrite_files: true
          files: |
            Bifrost-Android-*.apk
            windows-artifact/Bifrost-Windows-*.exe
            windows-artifact/Bifrost-Windows-*.zip
