name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

            - name: Configure stable Android signing
        if: env.BIFROST_KEYSTORE_BASE64 != ''
        shell: bash
        env:
          BIFROST_KEYSTORE_BASE64: ${{ secrets.BIFROST_KEYSTORE_BASE64 }}
          BIFROST_KEYSTORE_PASSWORD: ${{ secrets.BIFROST_KEYSTORE_PASSWORD }}
          BIFROST_KEY_PASSWORD: ${{ secrets.BIFROST_KEY_PASSWORD }}
          BIFROST_KEY_ALIAS: ${{ secrets.BIFROST_KEY_ALIAS }}
        run: |
          echo "$BIFROST_KEYSTORE_BASE64" | base64 --decode > android/bifrost-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$BIFROST_KEYSTORE_PASSWORD
          keyPassword=$BIFROST_KEY_PASSWORD
          keyAlias=$BIFROST_KEY_ALIAS
          storeFile=bifrost-upload.jks
          EOF


      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
