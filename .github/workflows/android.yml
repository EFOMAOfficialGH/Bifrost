name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Configure stable Android signing
        if: env.BIFROST_KEYSTORE_BASE64 != ''
        shell: bash
        env:
          BIFROST_KEYSTORE_BASE64: ${{ secrets.BIFROST_KEYSTORE_BASE64 }}
          BIFROST_KEYSTORE_PASSWORD: ${{ secrets.BIFROST_KEYSTORE_PASSWORD }}
          BIFROST_KEY_PASSWORD: ${{ secrets.BIFROST_KEY_PASSWORD }}
          BIFROST_KEY_ALIAS: ${{ secrets.BIFROST_KEY_ALIAS }}
        run: |
          echo "$BIFROST_KEYSTORE_BASE64" | base64 --decode > android/bifrost-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$BIFROST_KEYSTORE_PASSWORD
          keyPassword=$BIFROST_KEY_PASSWORD
          keyAlias=$BIFROST_KEY_ALIAS
          storeFile=../bifrost-upload.jks
          EOF
      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with version
        shell: bash
        run: |
          version="$(awk '/^version:/{print $2}' pubspec.yaml)"
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/master" ]]; then
            output="Bifrost-Android-latest.apk"
          else
            output="Bifrost-Android-${version}.apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "$output"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-android-apk
          path: Bifrost-Android-*.apk
          if-no-files-found: error

      - name: Generate release notes
        shell: bash
        run: |
          version="$(awk '/^version:/{print $2}' pubspec.yaml)"
          {
            echo "# Bifrost build"
            echo
            echo "- Version: $version"
            echo "- Commit: ${GITHUB_SHA:0:7}"
            echo "- Source: $GITHUB_REF_NAME"
            echo
            echo "## Recent changes"
            git log -10 --pretty=format:'- %s (%h)'
            echo
            echo
            echo "## Included downloads"
            echo "- Android APK"
            echo "- Windows installer"
            echo "- Windows portable ZIP"
          } > release-notes.md

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Bifrost {0}', github.ref_name) || 'Bifrost Latest Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: false
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: Bifrost-Android-*.apk
