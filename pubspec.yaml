name: bifrost
description: "Bifrost — local-network file sharing for Android and Windows."
publish_to: 'none'
version: 0.13.3+34

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  cupertino_icons: 1.0.8
  crypto: 3.0.6
  shelf: 1.4.2
  qr_flutter: 4.1.0
  file_picker: 13.1.0
  desktop_drop: ^0.8.4
  shared_preferences: 2.5.3
  flutter_local_notifications: 22.3.2
  open_filex: ^4.7.0
  flutter_colorpicker: ^1.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/localization/strings.json
  fonts:
    - family: MisticalSpring
      fonts:
        - asset: assets/fonts/MisticalSpringDEMOVERSION.ttf

flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: assets/icon.png
  image_path: assets/icon.png
  adaptive_icon_background: "#071238"
  adaptive_icon_foreground: assets/icon.png
